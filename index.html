<style>
/* Layout: one centered phone-width column; the current word card and the +1 button are the heroes. */
:root {
  /* Default scheme: Midnight Peach */
  --bg: #111827; --surface: #1b2438; --surface-2: #26314a; --line: #33405c;
  --fg: #f4f1ec; --muted: #a7b0c3;
  --accent: #ff9f7a; --on-accent: #2a1208; --accent-soft: rgba(255,159,122,.16);
  --good: #7fd6a6; --on-good: #0b2a1b;
  --font-display: "Outfit", "Avenir Next", system-ui, sans-serif;
  --font-body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r-lg: 28px; --r-md: 18px; --r-pill: 999px;
  color-scheme: dark;
}
:root[data-scheme="mocha"] {
  --bg: #f5eee8; --surface: #fffaf6; --surface-2: #efe3d9; --line: #e0cfc1;
  --fg: #2b1e19; --muted: #6f5a4f;
  --accent: #8a5a44; --on-accent: #fff7f2; --accent-soft: rgba(138,90,68,.12);
  --good: #3f7a5a; --on-good: #ffffff; color-scheme: light;
}
:root[data-scheme="lavender"] {
  --bg: #f2f0fa; --surface: #ffffff; --surface-2: #e8e4f7; --line: #d9d3ef;
  --fg: #1e1a33; --muted: #5d5878;
  --accent: #5b3fd6; --on-accent: #ffffff; --accent-soft: rgba(91,63,214,.12);
  --good: #23855f; --on-good: #ffffff; color-scheme: light;
}
:root[data-scheme="sage"] {
  --bg: #edf1ea; --surface: #fbfcf9; --surface-2: #e0e8dc; --line: #cfdac9;
  --fg: #1b2a21; --muted: #536559;
  --accent: #2d6a4c; --on-accent: #ffffff; --accent-soft: rgba(45,106,76,.12);
  --good: #b9822a; --on-good: #ffffff; color-scheme: light;
}
:root[data-scheme="arcade"] {
  --bg: #140f1f; --surface: #211934; --surface-2: #2e2447; --line: #40335f;
  --fg: #f7f3ff; --muted: #b3a8cf;
  --accent: #ff5c9e; --on-accent: #2b0716; --accent-soft: rgba(255,92,158,.16);
  --good: #42e0cf; --on-good: #062a26; color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--font-body); font-size: 16px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px 40px;
  -webkit-tap-highlight-color: transparent;
  transition: background .25s ease, color .25s ease;
}
.app { max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
h1, h2, h3 { font-family: var(--font-display); margin: 0; text-wrap: balance; letter-spacing: -.01em; }
p { margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
input { font: inherit; }

/* Header */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.logo {
  width: 38px; height: 38px; border-radius: 12px; background: var(--accent); color: var(--on-accent);
  display: grid; place-items: center; font-family: var(--font-display); font-weight: 800; font-size: 18px; flex: none;
}
.brand h1 { font-size: 21px; font-weight: 700; line-height: 1.1; }
.top-actions { display: flex; gap: 8px; align-items: center; }
.pill {
  display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: var(--r-pill);
  background: var(--surface); border: 1px solid var(--line); font-size: 12.5px; font-weight: 600; color: var(--muted); white-space: nowrap;
}
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.pill.live .dot { background: var(--good); box-shadow: 0 0 0 3px color-mix(in srgb, var(--good) 25%, transparent); }
.icon-btn {
  width: 40px; height: 40px; border-radius: 50%; background: var(--surface); border: 1px solid var(--line);
  display: grid; place-items: center;
}
.icon-btn svg { width: 20px; height: 20px; stroke: var(--fg); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

/* Cards & sections */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 20px; display: flex; flex-direction: column; gap: 14px; }
.label { font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.row { display: flex; gap: 10px; flex-wrap: wrap; }
.muted { color: var(--muted); }
.small { font-size: 14px; }

/* Inputs */
.names { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field input {
  width: 100%; padding: 12px 16px; border-radius: var(--r-md); border: 1px solid var(--line);
  background: var(--surface-2); color: var(--fg); font-weight: 600;
}

/* Segmented control */
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--surface-2); padding: 5px; border-radius: var(--r-pill); gap: 4px; }
.seg button { padding: 10px 8px; border-radius: var(--r-pill); font-weight: 600; font-size: 14.5px; color: var(--muted); transition: background .15s, color .15s; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }

/* Category chips */
.cats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.chip {
  padding: 14px 8px; border-radius: var(--r-md); background: var(--surface-2); border: 2px solid transparent;
  font-family: var(--font-display); font-weight: 600; font-size: 15.5px; text-align: center; transition: border-color .15s, background .15s;
}
.chip[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.hint { font-size: 13.5px; color: var(--muted); }

/* Buttons */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  padding: 16px 22px; border-radius: var(--r-pill); font-family: var(--font-display); font-weight: 700; font-size: 18px;
  background: var(--accent); color: var(--on-accent); transition: transform .08s ease, filter .15s;
}
.btn:active { transform: scale(.97); }
.btn:disabled { opacity: .5; cursor: default; }
.btn.block { width: 100%; }
.btn.ghost { background: var(--surface-2); color: var(--fg); }
.btn.good { background: var(--good); color: var(--on-good); }
.btn.small { padding: 10px 16px; font-size: 15px; }
.linkish { color: var(--muted); font-size: 14px; font-weight: 600; text-decoration: underline; text-underline-offset: 3px; padding: 6px; }

/* Play: word card */
.status { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.status h2 { font-size: 20px; }
.word-card {
  background: var(--accent); color: var(--on-accent); border-radius: 32px; padding: 22px 22px 26px;
  display: flex; flex-direction: column; gap: 6px; text-align: center; position: relative; overflow: hidden;
}
.word-card .label { color: inherit; opacity: .75; }
.the-word { font-family: var(--font-display); font-weight: 800; font-size: clamp(36px, 11vw, 56px); line-height: 1.05; overflow-wrap: anywhere; padding-block: 6px; }
.cover {
  position: absolute; inset: 0; background: var(--accent); display: grid; place-items: center;
  font-family: var(--font-display); font-weight: 700; font-size: 18px; border-radius: inherit;
}
.counter-wrap { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 14px; }
.plus {
  width: 140px; height: 140px; border-radius: 50%; background: var(--surface); border: 3px solid var(--accent);
  font-family: var(--font-display); font-weight: 800; font-size: 44px; color: var(--fg);
  box-shadow: 0 10px 30px -12px var(--accent); transition: transform .06s ease; touch-action: manipulation;
  display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1;
}
.plus span { font-size: 13px; font-weight: 600; color: var(--muted); margin-top: 6px; font-family: var(--font-body); }
.plus:active { transform: scale(.94); }
.stat { text-align: center; }
.stat b { display: block; font-family: var(--font-display); font-size: 34px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.1; }
.stat small { font-size: 12.5px; color: var(--muted); font-weight: 600; }
.bump { animation: bump .18s ease; }
@keyframes bump { 50% { transform: scale(1.18); } }

.actions { display: grid; grid-template-columns: 1fr 1fr 1.7fr; gap: 8px; }
.actions .btn { padding-inline: 10px; white-space: nowrap; font-size: 17px; }

/* Word list */
.list { display: flex; flex-direction: column; gap: 6px; list-style: none; margin: 0; padding: 0; }
.list li {
  display: grid; grid-template-columns: 28px 1fr auto; align-items: center; gap: 10px;
  padding: 10px 14px; border-radius: 14px; background: var(--surface-2); font-weight: 500;
}
.list li .n { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.list li .w { min-width: 0; overflow-wrap: anywhere; }
.list li .c { font-variant-numeric: tabular-nums; font-weight: 700; font-family: var(--font-display); }
.list li.done .w { color: var(--muted); }
.list li.now { background: var(--accent-soft); outline: 2px solid var(--accent); }
.list li.locked .w { color: var(--muted); letter-spacing: .2em; }
.list li.tappable { padding: 0; }
.list li > button { display: grid; grid-template-columns: 28px 1fr auto; align-items: center; gap: 10px; width: 100%; padding: 10px 14px; text-align: left; border-radius: 14px; }
.list li.tappable .c::after { content: " ›"; color: var(--muted); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.seatrow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center; }
.seat { padding: 12px 16px; border-radius: var(--r-pill); background: var(--surface-2); border: 2px solid var(--line); font-weight: 600; font-size: 14.5px; white-space: nowrap; }
.seat.on { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.seat.joined { color: var(--good); border-color: var(--good); }
.scores { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.score { background: var(--surface); border: 2px solid var(--line); border-radius: var(--r-md); padding: 12px 14px; display: flex; flex-direction: column; min-width: 0; }
.score > span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.score b { font-family: var(--font-display); font-size: 30px; line-height: 1.15; font-variant-numeric: tabular-nums; }
.score.on { border-color: var(--accent); }
.scores.final .score b { font-size: 44px; }
.scores.final .score.on b { color: var(--accent); }
.hero { align-items: stretch; text-align: center; }
.hero-title { font-size: 28px; }
.waiting { align-items: center; padding-block: 32px; }
.table > div { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 15px; }
.table > div:last-child { border-bottom: 0; }
.table b { text-align: right; font-family: var(--font-display); font-variant-numeric: tabular-nums; overflow: hidden; text-overflow: ellipsis; }
.table .th b { font-family: var(--font-body); font-size: 12.5px; color: var(--muted); font-weight: 600; }
details.card { gap: 0; }
details.card[open] { gap: 14px; }
details summary { display: flex; justify-content: space-between; gap: 10px; cursor: pointer; font-weight: 600; list-style: none; }
details summary::-webkit-details-marker { display: none; }

/* Progress dots */
.dots { display: flex; gap: 6px; justify-content: center; }
.dots i { width: 22px; height: 6px; border-radius: 3px; background: var(--line); }
.dots i.done { background: var(--good); }
.dots i.now { background: var(--accent); }

/* Guesser */
.listen { text-align: center; padding-block: 18px; display: flex; flex-direction: column; gap: 8px; align-items: center; }
.listen .big { font-family: var(--font-display); font-weight: 800; font-size: 96px; line-height: 1; font-variant-numeric: tabular-nums; color: var(--accent); }

/* Summary */
.total { text-align: center; display: flex; flex-direction: column; gap: 4px; padding-block: 8px; }
.total .big { font-family: var(--font-display); font-size: 84px; font-weight: 800; line-height: 1; color: var(--accent); font-variant-numeric: tabular-nums; }
.bars { display: flex; flex-direction: column; gap: 8px; }
.bar { display: grid; grid-template-columns: minmax(0, 1fr) 2fr 32px; align-items: center; gap: 10px; font-size: 14.5px; }
.bar .track { height: 12px; border-radius: 6px; background: var(--surface-2); overflow: hidden; }
.bar .fill { height: 100%; border-radius: 6px; background: var(--accent); }
.bar .w { overflow-wrap: anywhere; font-weight: 500; }
.bar .c { text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; }
.highlights { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.hl { background: var(--surface-2); border-radius: var(--r-md); padding: 12px 14px; min-width: 0; }
.hl b { display: block; font-family: var(--font-display); font-size: 18px; overflow-wrap: anywhere; }

.history { display: flex; flex-direction: column; gap: 6px; }
.history div { display: flex; justify-content: space-between; gap: 10px; font-size: 14.5px; padding: 8px 0; border-bottom: 1px solid var(--line); }
.history div:last-child { border-bottom: 0; }
.history b { font-variant-numeric: tabular-nums; font-family: var(--font-display); }

/* Theme sheet */
.schemes { display: grid; grid-template-columns: 1fr; gap: 8px; }
.scheme {
  display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 12px; padding: 10px 14px;
  border-radius: var(--r-md); background: var(--surface-2); border: 2px solid transparent; text-align: left;
}
.scheme[aria-pressed="true"] { border-color: var(--accent); }
.swatch { display: flex; }
.swatch i { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--surface); margin-left: -6px; }
.swatch i:first-child { margin-left: 0; }
.scheme small { display: block; color: var(--muted); font-size: 12.5px; }
.scheme b { font-family: var(--font-display); font-weight: 600; }

.sheet-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 30; display: flex; align-items: flex-end; justify-content: center; }
.sheet {
  width: 100%; max-width: 560px; background: var(--surface); border-radius: 28px 28px 0 0;
  padding: 20px max(16px, env(safe-area-inset-left, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 14px; max-height: 88vh; overflow-y: auto;
}
.sheet-head { display: flex; justify-content: space-between; align-items: center; }

.toast {
  position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
  background: var(--fg); color: var(--bg); padding: 12px 18px; border-radius: var(--r-pill); font-weight: 600; font-size: 14px;
  z-index: 40; max-width: calc(100% - 32px); text-align: center;
}
.loading { text-align: center; padding: 40px 10px; display: flex; flex-direction: column; gap: 12px; align-items: center; }
.spinner { width: 34px; height: 34px; border-radius: 50%; border: 4px solid var(--surface-2); border-top-color: var(--accent); animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.rules { font-size: 14.5px; color: var(--muted); padding-left: 18px; margin: 0; display: flex; flex-direction: column; gap: 4px; }

@media (max-width: 380px) {
  .cats { grid-template-columns: repeat(2, 1fr); }
  .plus { width: 120px; height: 120px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>

  { id: "arcade", name: "Neon Arcade", note: "Game-show pink and teal", sw: ["#140f1f","#2e2447","#ff5c9e","#42e0cf"] },

/* ---------- Helpers ---------- */
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const store = {
  get(k, d) { try { const v = localStorage.getItem("pw:" + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem("pw:" + k, JSON.stringify(v)); } catch {} },

const DEVICE = store.get("device", null) || (() => { const id = Math.random().toString(36).slice(2, 10); store.set("device", id); return id; })();
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
let toastTimer;

const catName = (id) => (CATEGORIES.find((c) => c.id === id) || {}).name || id;
const diffName = (id) => (DIFFS.find((d) => d.id === id) || {}).name || id;

/* ---------- State ---------- */
// Shared game state (synced across phones when possible)
const PHASES = ["lobby", "ready", "play", "turnEnd", "final"];
function freshGame() {
  return {
    rev: 0, writer: DEVICE, phase: "lobby",
    players: ["Player 1", "Player 2"], seats: [null, null],
    starter: 0, turn: 0, matchLen: 1,
    category: "classic", difficulty: "easy", source: "bank",
    words: [], idx: 0, rounds: [], used: [], dealing: false,
  };
}
function normalize(d) {
  const g = Object.assign(freshGame(), JSON.parse(JSON.stringify(d)));

  if (!Array.isArray(g.seats) || g.seats.length !== 2) g.seats = [null, null];
  if (![1, 3].includes(g.matchLen)) g.matchLen = 1;

}
let game = freshGame();
const giverIdx = () => (game.starter + game.turn) % 2;
const totalTurns = () => game.matchLen * 2;
const roundNo = () => Math.min(game.matchLen, Math.floor(game.turn / 2) + 1);
// Per-device settings
let local = {
  shared: store.get("shared", false),
  scheme: store.get("scheme", "midnight"),
  peek: false,
};
document.documentElement.dataset.scheme = local.scheme;

/* ---------- Sync (claude db) ---------- */
let db = null, docRef = null, synced = false, writing = Promise.resolve(), writeTimer = null;
function setSync(state) {
  const pill = $("#sync"); const txt = $("#syncText");
  pill.classList.toggle("live", state === "live");
  txt.textContent = state === "live" ? "Synced" : state === "connecting" ? "Linking…" : "Solo";
}
async function initSync() {
  try { db = await window.claude?.use?.("db"); } catch { db = null; }
  if (!db) { setSync("local"); return; }
  setSync("connecting");
  docRef = db.doc("games/table");
  const timer = setTimeout(() => { if (!synced) setSync("local"); }, 10000);
  docRef.onSnapshot((snap) => {
    if (!snap.metadata?.fromCache) { clearTimeout(timer); synced = true; setSync("live"); }
    if (!snap.exists || snap.metadata?.hasPendingWrites) return;
    const d = snap.data();
    if (!d || typeof d.rev !== "number") return;
    // Skip echoes of this phone's own writes; always take the other phone's.
    if (d.writer === DEVICE && d.rev <= game.rev) return;
    const rev = Math.max(game.rev, d.rev);

}

  writeTimer = setTimeout(() => {
    writeTimer = null;
    const snapshot = JSON.parse(JSON.stringify(game));
    writing = writing.then(() => docRef.set(snapshot)).catch((e) => {
      if (e && (e.code === "permission_denied" || e.code === "not_granted")) {
        toast("This phone can only watch. Ask the owner to share the game with you as a Contributor.");
      }
    });
  }, 150);
}

/* ---------- Word dealing ---------- */
let sample = null;
async function initSample() {
  try { sample = await window.claude?.use?.("sample"); } catch { sample = null; }
  render();
}
function dealFromBank() {
  const pool = BANK[game.category][game.difficulty];
  let fresh = pool.filter((w) => !game.used.includes(w));
  if (fresh.length < 10) { game.used = game.used.filter((w) => !pool.includes(w)); fresh = pool.slice(); }
  return shuffle(fresh).slice(0, 10);
}
async function dealFromClaude() {
  const diffText = { easy: "easy: common, concrete words anyone could get in a couple of clues", medium: "medium: well-known but trickier, needs some creative clues", hard: "hard: abstract ideas, niche references or words that are tough to hint at" }[game.difficulty];
  const prompt = `You are writing cards for the party game Password, where one player gives short spoken clues so their partner says the exact target word.
Category: ${catName(game.category)}. Difficulty: ${diffText}.
Give 10 different target words or short phrases (1 to 3 words each) that fit the category and difficulty, are family-friendly, and are fun to clue.
Do not use any of these: ${game.used.slice(-150).join(", ") || "(none)"}.
Reply with only a JSON array of 10 strings.`;
  const out = await sample.json(prompt, { modelTier: "quick", cache: false });
  const list = Array.isArray(out) ? out.filter((w) => typeof w === "string" && w.trim()).map((w) => w.trim().slice(0, 40)) : [];
  if (list.length < 10) throw { code: "short" };

}
async function deal() {
  if (game.dealing) return;
  let words;

    game.dealing = true; commit();
    try { words = await dealFromClaude(); }
    catch (e) {
      words = dealFromBank();
      toast(e && e.code === "not_granted" ? "Claude wasn't allowed, so these words come from the built-in list." : "Couldn't get fresh words, so these come from the built-in list.");
    }

    words = dealFromBank();
  }
  game.words = words.map((w) => ({ w, count: 0, done: false }));
  game.used = game.used.concat(words);
  game.idx = 0; game.phase = "play"; game.dealing = false; local.peek = false;
  commit();
}

/* ---------- Actions ---------- */
function mySeat() {
  if (local.shared) return "shared";
  const i = game.seats.indexOf(DEVICE);
  return i >= 0 ? i : null;
}
function role() {
  const s = mySeat();

  if (s === null) return "watcher";

}
const canClue = () => ["giver", "shared"].includes(role());
function claimSeat(i) {

  local.shared = false; store.set("shared", false);
  commit();
}
function useShared() { local.shared = !local.shared; store.set("shared", local.shared); render(); }
function startMatch() { game.turn = 0; game.rounds = []; game.words = []; game.phase = "ready"; commit(); }
function tap(n) {

}
function openWord(i) {

  game.idx = i; game.words[i].done = false; local.peek = false;
  commit();
}
function goBack() { if (game.idx > 0) openWord(game.idx - 1); }

  const cur = game.words[game.idx]; if (!cur) return;

  }

}
function endTurn() {

}
function nextTurn() { game.phase = "ready"; game.words = []; game.idx = 0; commit(); }
function backToReady() { game.phase = "ready"; game.words = []; game.idx = 0; commit(); }

function playAgain() { game.turn = 0; game.rounds = []; game.words = []; game.starter = game.starter ? 0 : 1; game.phase = "ready"; commit(); }
function toLobby() { game.phase = "lobby"; game.words = []; game.turn = 0; game.rounds = []; commit(); }

/* ---------- Views ---------- */
const plural = (n, w) => `${n} ${n === 1 ? w : w + "s"}`;
function totals() {

  return { t, c };
}
function scoreStrip() {
  const { t, c } = totals();

  return `<div class="scores">${[0, 1].map((i) => `<div class="score ${i === g ? "on" : ""}">
    <span class="small muted">${esc(game.players[i])}${i === g ? " · giving clues" : ""}</span>

}
function roundLabel() { return `Round ${roundNo()} of ${game.matchLen}`; }
function pickers(compact) {

  return `
    <span class="label">Category</span>
    <div class="cats">${CATEGORIES.map((c) => `<button class="chip" data-cat="${c.id}" aria-pressed="${game.category === c.id}">${c.name}</button>`).join("")}</div>
    <span class="label">Difficulty</span>

function lobbyView() {
  const me = mySeat();

    const s = game.seats[i];

  };

  <section class="card">
    <span class="label">Players</span>

function rulesCard() {

}

function dotsHtml() {

}
function playView() {

  const r = role();
  const cur = game.words[game.idx];

  const giverName = esc(game.players[giverIdx()]);
  const meta = `${roundLabel()} · ${esc(catName(game.category))} · ${esc(diffName(game.difficulty))}`;
  if (r === "guesser" || r === "watcher") {
    const solved = game.words.filter((w) => w.done);
    return `
    <div class="status"><h2>Your turn to guess</h2><span class="pill">${meta}</span></div>

}
function wordBars(words) {

}

  <button class="btn block" id="playAgain">Play again · ${esc(game.players[game.starter ? 0 : 1])} starts</button>
  <button class="btn block ghost" id="toLobby">Change settings</button>
  ${game.rounds.map((r) => `<details class="card"><summary><span>${esc(r.player)} · Round ${r.round}</span><b>${plural(r.total, "word")}</b></summary>${wordBars(r.words)}</details>`).join("")}`;
}

function render() {
  const v = $("#view");
  const active = document.activeElement && document.activeElement.id;
  const views = { lobby: lobbyView, ready: readyView, play: playView, turnEnd: turnEndView, final: finalView };
  v.innerHTML = `<div class="app" style="padding:0">${(views[game.phase] || lobbyView)()}</div>`;
  if (active === "p0" || active === "p1") { const el = $("#" + active); if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); } }
  bind();
}
function bind() {
  const on = (sel, fn) => { const el = $(sel); if (el) el.addEventListener("click", fn); };
  const all = (sel, fn) => document.querySelectorAll(sel).forEach((b) => b.addEventListener("click", () => fn(b)));
  all("[data-claim]", (b) => claimSeat(Number(b.dataset.claim)));
  all("[data-cat]", (b) => { game.category = b.dataset.cat; commit(); });
  all("[data-diff]", (b) => { game.difficulty = b.dataset.diff; commit(); });
  all("[data-src]", (b) => { game.source = b.dataset.src; commit(); });
  all("[data-len]", (b) => { game.matchLen = Number(b.dataset.len); commit(); });
  all("[data-starter]", (b) => { game.starter = Number(b.dataset.starter); commit(); });
  all("[data-open]", (b) => openWord(Number(b.dataset.open)));
  ["p0", "p1"].forEach((id, i) => {
    const el = $("#" + id); if (!el) return;
    let t;
    el.addEventListener("input", () => { clearTimeout(t); t = setTimeout(() => { game.players[i] = el.value.trim() || `Player ${i + 1}`; commit(); }, 600); });
  });
  on("#sharedBtn", useShared);
  on("#startBtn", startMatch);
  on("#dealBtn", deal);
  on("#plus", () => tap(1));
  on("#minus", () => tap(-1));
  on("#back", goBack);
  on("#got", gotIt);
  on("#peek", () => { local.peek = true; render(); });
  on("#hide", () => { local.peek = false; render(); });
  on("#quit", backToReady);
  on("#nextTurn", nextTurn);
  on("#endGame", endGame);
  on("#playAgain", playAgain);
  on("#toLobby", toLobby);
}

/* ---------- Theme sheet ---------- */
function openThemes() {
  const root = $("#sheetRoot");
  const draw = () => {
    root.innerHTML = `<div class="sheet-backdrop" id="backdrop"><div class="sheet" role="dialog" aria-label="Color schemes">
      <div class="sheet-head"><h3>Colors</h3><button class="btn small ghost" id="closeSheet">Done</button></div>
      <p class="hint">Each phone keeps its own choice. Tap one to try it.</p>
      <div class="schemes">${SCHEMES.map((s) => `<button class="scheme" data-scheme="${s.id}" aria-pressed="${local.scheme === s.id}">
        <span class="swatch">${s.sw.map((c) => `<i style="background:${c}"></i>`).join("")}</span>
        <span><b>${s.name}</b><small>${s.note}</small></span>
        <span class="muted small">${local.scheme === s.id ? "On" : ""}</span></button>`).join("")}</div>
    </div></div>`;
    root.querySelectorAll("[data-scheme]").forEach((b) => b.addEventListener("click", () => {
      local.scheme = b.dataset.scheme; store.set("scheme", local.scheme);
      document.documentElement.dataset.scheme = local.scheme; draw();
    }));
    $("#closeSheet").addEventListener("click", () => (root.innerHTML = ""));
    $("#backdrop").addEventListener("click", (e) => { if (e.target.id === "backdrop") root.innerHTML = ""; });
  };
  draw();
}
$("#themeBtn").addEventListener("click", openThemes);

/* ---------- Boot ---------- */
function start(saved) {
  if (saved && saved.game) game = normalize(saved.game);
  render();
  initSync();
  initSample();
}
window.claude?.hot?.snapshot?.(() => ({ game }));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
